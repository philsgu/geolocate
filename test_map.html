<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Initialize map
        var map = L.map('map').setView([37.221468, -102.303859], 4);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Test data - just a few points
        const testData = [
            {"aamc_id": "10572605", "name": "Westbrook, David", "lat": 34.0439555, "lng": -117.2575304, "school_type": "International School"},
            {"aamc_id": "12947547", "name": "Chew, Victor", "lat": 37.7243255, "lng": -122.4283276, "school_type": "US D.O. School"},
            {"aamc_id": "13289302", "name": "Beltran, Jose Antonio", "lat": 34.1873702, "lng": -118.9395539, "school_type": "US M.D. Public School"}
        ];

        // Function to determine marker color
        function getMarkerColor(schoolType) {
            if (schoolType === "US M.D. Private School" || schoolType === "US M.D. Public School") {
                return 'red';
            } else if (schoolType === "US D.O. School") {
                return 'blue';
            } else {
                return 'grey';
            }
        }

        // Add test markers
        testData.forEach(function(data, index) {
            var color = getMarkerColor(data.school_type);
            
            // Create a simple circle marker
            var marker = L.circleMarker([data.lat, data.lng], {
                radius: 8,
                fillColor: color,
                color: 'white',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            });
            
            // Add popup
            var popupContent = `
                <div style="font-family: Arial, sans-serif;">
                    <h4 style="margin: 0 0 10px 0; color: #333;">${data.name}</h4>
                    <p style="margin: 5px 0;"><strong>AAMC ID:</strong> ${data.aamc_id}</p>
                    <p style="margin: 5px 0;"><strong>School Type:</strong> ${data.school_type}</p>
                </div>
            `;
            
            marker.bindPopup(popupContent);
            marker.addTo(map);
        });
    </script>
</body>
</html>
